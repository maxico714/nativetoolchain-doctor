name: Dependency Review

on:
  pull_request:
    permissions:
      contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dependency Review
        uses: actions/dependency-review-action@main
        with:
          config-file: '.github/dependency-review-config.yml'